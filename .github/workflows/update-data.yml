name: Actualizar datos ENSO

# NOAA CPC publica el boletín ENSO el segundo jueves de cada mes (~día 8-14).
# Corremos el día 12 a las 15:00 UTC y otra vez el 14 como reintento por si
# el boletín se retrasa o la cuota de Open-Meteo se agotó en la primera pasada.
on:
  schedule:
    - cron: '0 15 12 * *'
    - cron: '0 15 14 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependencias del pipeline
        run: pip install -r pipeline/requirements.txt

      - name: Ejecutar pipeline (ONI + proyección + análogos + teleconexiones)
        run: python pipeline/run.py

      - name: Tests del pipeline
        run: python -m unittest discover -s pipeline/tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verificar paridad del modelo y build de producción
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit de los datos actualizados
        run: |
          if git diff --quiet -- web/public/data pipeline/data; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git config user.name  "enso3d-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data pipeline/data
          git commit -m "data: actualización mensual ENSO ($(date -u +%Y-%m-%d))"
          git push
